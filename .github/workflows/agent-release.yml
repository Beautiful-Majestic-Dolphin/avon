# AVON Agent Release
#
# Builds native agent binaries for every supported platform, packages the
# installers each platform actually uses — deb/rpm on Linux, a universal signed
# and notarized .pkg on macOS, an Authenticode-signed MSI on Windows — and
# attaches them, with checksums, to the GitHub Release created by build.yml.
#
# Signing is conditional on secrets: without them the same artifacts are built
# unsigned, so a fork's release still produces something installable.

name: Agent Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Raw binaries for every target (also the tarball payloads)
  # ---------------------------------------------------------------------------
  build-agent:
    name: Build Agent (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: false
            strip: true
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: true
            strip: false
          - target: x86_64-apple-darwin
            runner: macos-13
            cross: false
            strip: true
          - target: aarch64-apple-darwin
            runner: macos-14
            cross: false
            strip: true
          # Static musl builds: one binary that runs on any glibc vintage,
          # which is what an appliance or a container image wants.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            cross: true
            strip: false
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            cross: true
            strip: false
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            cross: false
            strip: false

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.target }}

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked --version 0.2.5

      # The helper is a Unix binary: on Windows the agent service owns the
      # adapter itself, because a WinTun session cannot be handed to another
      # process.
      - name: Build (Unix)
        if: ${{ !matrix.cross && runner.os != 'Windows' }}
        run: cargo build --release --locked -p avon-agent --target ${{ matrix.target }} --bin avon-agent --bin avon-agent-helper

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --locked -p avon-agent --target ${{ matrix.target }} --bin avon-agent --bin avon-agent-helper

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release --locked -p avon-agent --target ${{ matrix.target }} --bin avon-agent

      - name: Strip binaries
        if: matrix.strip
        run: |
          strip target/${{ matrix.target }}/release/avon-agent
          strip target/${{ matrix.target }}/release/avon-agent-helper

      - name: Upload binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/avon-agent
            target/${{ matrix.target }}/release/avon-agent-helper
            target/${{ matrix.target }}/release/avon-agent.exe
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Linux: deb, rpm and tarballs for both architectures
  # ---------------------------------------------------------------------------
  package-linux:
    name: Package Linux (${{ matrix.arch }})
    needs: build-agent
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agent-${{ matrix.target }}
          path: staged

      # cargo-deb and cargo-generate-rpm package what is already built; the
      # metadata in crates/avon-agent/Cargo.toml points at target/release.
      - name: Stage binaries where the package metadata expects them
        run: |
          mkdir -p target/release
          cp staged/avon-agent staged/avon-agent-helper target/release/
          chmod +x target/release/avon-agent target/release/avon-agent-helper

      - name: Install packaging tools
        run: |
          cargo install cargo-deb --version 2.7.0 --locked
          cargo install cargo-generate-rpm --version 0.16.0 --locked

      - name: Build deb and rpm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cargo deb -p avon-agent --no-build --no-strip --deb-version "$VERSION" \
            --target-arch ${{ matrix.arch }} --output "dist/"
          cargo generate-rpm -p crates/avon-agent --auto-req no -o "dist/"

      - name: Build tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="avon-agent-${VERSION}-linux-${{ matrix.arch }}"
          mkdir -p "$NAME"
          cp target/release/avon-agent target/release/avon-agent-helper "$NAME/"
          cp deploy/linux/avon-agent.service deploy/linux/avon-agent-helper.service "$NAME/"
          cp LICENSE README.md "$NAME/"
          tar czf "dist/${NAME}.tar.gz" "$NAME"

      - name: Upload Linux packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Static musl tarballs
  # ---------------------------------------------------------------------------
  package-musl:
    name: Package musl (${{ matrix.arch }})
    needs: build-agent
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            target: aarch64-unknown-linux-musl
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agent-${{ matrix.target }}
          path: staged

      - name: Assert the binaries really are static
        run: |
          for bin in staged/avon-agent staged/avon-agent-helper; do
            file "$bin"
            file "$bin" | grep -q "statically linked" || {
              echo "$bin is not static — a musl build that links dynamically defeats the point" >&2
              exit 1
            }
          done

      - name: Build tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="avon-agent-${VERSION}-linux-${{ matrix.arch }}-musl"
          mkdir -p "$NAME" dist
          cp staged/avon-agent staged/avon-agent-helper "$NAME/"
          chmod +x "$NAME"/avon-agent*
          cp deploy/linux/avon-agent.service deploy/linux/avon-agent-helper.service LICENSE "$NAME/"
          tar czf "dist/${NAME}.tar.gz" "$NAME"

      - name: Upload musl tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-musl-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # macOS: universal, signed and notarized .pkg
  # ---------------------------------------------------------------------------
  package-macos:
    name: Package macOS Universal
    needs: build-agent
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-macos-universal

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Two identities: codesign needs "Developer ID Application", productsign
      # needs "Developer ID Installer". Signing binaries with the installer
      # identity (or the package with the application one) produces artifacts
      # Gatekeeper rejects.
      # The secrets context is not available in `if`, so the value is lifted into
      # env first and the condition reads that.
      - name: Import signing certificates
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_INSTALLER_CERTIFICATE: ${{ secrets.MACOS_INSTALLER_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_KEYCHAIN_PWD: ${{ secrets.MACOS_KEYCHAIN_PWD }}
        run: |
          security create-keychain -p "$MACOS_KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$MACOS_KEYCHAIN_PWD" build.keychain
          echo "$MACOS_CERTIFICATE" | base64 --decode > app.p12
          security import app.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" \
            -T /usr/bin/codesign -T /usr/bin/productsign
          if [ -n "$MACOS_INSTALLER_CERTIFICATE" ]; then
            echo "$MACOS_INSTALLER_CERTIFICATE" | base64 --decode > installer.p12
            security import installer.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" \
              -T /usr/bin/codesign -T /usr/bin/productsign
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_KEYCHAIN_PWD" build.keychain
          rm -f app.p12 installer.p12

      - name: Build package
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_INSTALLER_CERTIFICATE: ${{ secrets.MACOS_INSTALLER_CERTIFICATE }}
          MACOS_APP_IDENTITY: ${{ secrets.MACOS_APP_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash deploy/macos/build-pkg.sh --version "$VERSION" --out dist

      - name: Verify package contents
        run: bash deploy/macos/test-pkg.sh

      - name: Upload macOS package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-macos-package
          path: dist/*.pkg
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Windows: MSI with the pinned wintun.dll
  # ---------------------------------------------------------------------------
  package-windows:
    name: Package Windows MSI
    needs: build-agent
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-windows-msi

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add WiX to PATH
        shell: pwsh
        run: |
          $wix = Get-ChildItem "C:\Program Files (x86)" -Filter "WiX Toolset*" -Directory |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $wix) { throw "WiX v3 is not installed on this runner" }
          "$($wix.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build MSI
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          ./deploy/windows/build-msi.ps1 -Version $version -Out dist

      - name: Upload Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-windows-package
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Publish everything with one checksum file
  # ---------------------------------------------------------------------------
  publish-release-assets:
    name: Publish Release Assets
    needs: [package-macos, package-linux, package-musl, package-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: agent-*
          merge-multiple: true
          path: release-assets

      - name: Generate checksums
        working-directory: release-assets
        run: |
          rm -f avon-agent avon-agent-helper avon-agent.exe *.sha256
          ls -la
          sha256sum * > checksums.sha256
          cat checksums.sha256

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v0.1.15
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
