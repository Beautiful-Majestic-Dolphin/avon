# AVON Continuous Integration
#
# Runs on all PRs and pushes to main/develop branches.
# Validates code quality, runs tests, and lints Helm charts.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-check:
    name: Rust Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates -> target"

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        # Note: --all-features intentionally not used. The `fido2` feature
        # in avon-agent is currently broken (uses ctap-hid-fido2 APIs that
        # don't exist in v3.5) and `tpm` needs libtss2-esys-dev on the runner.
        # See crates/avon-agent/src/identity/fido2.rs for the TODO.
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all
        env:
          RUST_LOG: debug

      - name: Check documentation
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  agent-platform-check:
    name: Agent Platform Check (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-14
          - os: windows
            runner: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates -> target"
          key: ${{ matrix.os }}

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run clippy on agent
        run: cargo clippy -p avon-agent --all-targets -- -D warnings

      - name: Run agent tests
        run: cargo test -p avon-agent
        env:
          RUST_LOG: debug

  python-check:
    name: Python Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black ruff mypy pytest pytest-asyncio pytest-cov
          pip install -e services/policy-engine[dev] || pip install -e services/policy-engine
          pip install -e api/admin-api[dev] || pip install -e api/admin-api

      - name: Run black
        # Exclude protobuf-generated files; they're regenerated on build.
        run: black --check services/ --exclude '\.venv|_pb2(_grpc)?\.py'

      - name: Run ruff
        run: ruff check services/ --exclude '_pb2.py,_pb2_grpc.py'

      - name: Run mypy
        run: mypy services/ --ignore-missing-imports
        continue-on-error: true

      - name: Run tests
        run: pytest services/ -v --tb=short
        env:
          PYTHONPATH: services/policy-engine:api/admin-api

  integration-tests:
    name: Integration Tests
    needs: [rust-check, python-check]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: avon
          POSTGRES_PASSWORD: test
          POSTGRES_DB: avon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates -> target"

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run integration tests
        run: cargo test --test '*' -- --test-threads=1
        env:
          DATABASE_URL: postgres://avon:test@localhost:5432/avon_test
          REDIS_URL: redis://localhost:6379
          RUST_LOG: debug

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      - name: Lint Helm chart
        run: helm lint deploy/helm/avon

      - name: Validate Helm templates
        run: |
          helm template avon deploy/helm/avon > /dev/null
          helm template avon deploy/helm/avon -f deploy/helm/avon/values-dev.yaml > /dev/null
          helm template avon deploy/helm/avon -f deploy/helm/avon/values-staging.yaml > /dev/null
          helm template avon deploy/helm/avon -f deploy/helm/avon/values-production.yaml > /dev/null

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit
        continue-on-error: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  all-checks-pass:
    name: All Checks Pass
    needs: [rust-check, python-check, integration-tests, helm-lint, security-scan]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: echo "All CI checks passed successfully!"
