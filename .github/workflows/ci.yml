name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  AVON_TEST_DATABASE_URL: postgres://avon:test@localhost:5432/postgres
  AVON_TEST_REDIS_URL: redis://localhost:6379

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   runner: ubuntu-24.04 }
          - { os: macos,   runner: macos-14 }
          - { os: windows, runner: windows-2022 }
    services:
      postgres:
        image: ${{ matrix.os == 'linux' && 'postgres:16' || '' }}
        env: { POSTGRES_USER: avon, POSTGRES_PASSWORD: test, POSTGRES_DB: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: ${{ matrix.os == 'linux' && 'redis:7' || '' }}
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.85.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.os }}
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install swtpm for TPM tests (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y swtpm tpm2-tools
          mkdir -p /tmp/swtpm0 /tmp/swtpm1
          swtpm socket --tpmstate dir=/tmp/swtpm0 --ctrl type=tcp,port=2321 --server type=tcp,port=2322 --flags not-need-init --tpm2 &
          swtpm socket --tpmstate dir=/tmp/swtpm1 --ctrl type=tcp,port=2323 --server type=tcp,port=2324 --flags not-need-init --tpm2 &
          sleep 2
          tpm2_startup -c -T swtpm:host=127.0.0.1,port=2321 || true
          tpm2_startup -c -T swtpm:host=127.0.0.1,port=2323 || true
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: "Unit and integration tests (Linux: with Postgres/Redis)"
        if: matrix.os == 'linux'
        run: AVON_TEST_TPM=swtpm AVON_TPM_TCTI=swtpm:host=127.0.0.1,port=2321 AVON_TEST_TPM_ALT_TCTI=swtpm:host=127.0.0.1,port=2323 cargo test --workspace --locked --features avon-crypto/test-vectors,avon-keystore/tpm2
      - name: "Unit tests (macOS/Windows: crates without database needs)"
        if: matrix.os != 'linux'
        run: cargo test --workspace --locked --exclude avon-db --exclude avon-testkit --exclude avon-observability --features avon-crypto/test-vectors
      - name: Docs
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  python:
    name: Python
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: avon, POSTGRES_PASSWORD: test, POSTGRES_DB: postgres }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: "0.5.x"
      - name: Admin API — sync, lint, test
        working-directory: api/admin-api
        run: |
          uv sync --frozen --extra dev
          uv run ruff check src tests
          uv run black --check src tests
          uv run pytest -q
        env:
          AVON_TEST_DATABASE_URL: postgres://avon:test@localhost:5432/postgres
      - name: "Admin API — dependency audit"
        working-directory: api/admin-api
        # Audit the exported requirements: pip-audit cannot resolve the local
        # project itself against PyPI. PYSEC-2026-1325 (ecdsa, no fix released)
        # arrives via python-jose, which task 4.9 removes.
        run: |
          uv export --frozen --no-dev --format requirements-txt --no-emit-project > requirements.audit.txt
          uv run pip-audit --strict -r requirements.audit.txt --ignore-vuln PYSEC-2026-1325
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.85.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  docker:
    name: Docker images build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build control image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/Dockerfile.rust
          build-args: BIN=avon-control
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build ca image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/Dockerfile.rust
          build-args: BIN=avon-ca
          push: false
          cache-from: type=gha
      - name: Build bootstrap image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/Dockerfile.rust
          build-args: BIN=avon-bootstrap
          push: false
          cache-from: type=gha
      - name: Build gateway image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/Dockerfile.rust
          build-args: BIN=avon-gateway
          push: false
          cache-from: type=gha
      - name: Build admin-api image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/Dockerfile.admin-api
          push: false

  helm:
    name: Helm lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.2
      - name: Install kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform
      - run: helm lint deploy/helm/avon
      - run: |
          for f in values.yaml values-dev.yaml values-staging.yaml values-production.yaml; do
            helm template avon deploy/helm/avon -f deploy/helm/avon/$f \
              --set control.existingSecret=avon-control-secret > /dev/null
          done
      - name: Validate rendered manifests against the Kubernetes schemas
        run: |
          helm template avon deploy/helm/avon --set control.existingSecret=avon-control-secret \
            | kubeconform -strict -ignore-missing-schemas

  fuzz-smoke:
    name: Fuzz smoke (60s per target)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly-2025-06-01
      - run: cargo install cargo-fuzz --locked
      - name: Run each crypto target for 60 seconds
        working-directory: crates/avon-crypto
        run: |
          for t in cert_decode hybrid_pk_decode hybrid_sig_decode tbs_roundtrip; do
            cargo +nightly-2025-06-01 fuzz run "$t" -- -max_total_time=60 -rss_limit_mb=4096
          done
      - name: Run each tunnel target for 60 seconds
        working-directory: crates/avon-tunnel
        run: |
          for t in header_decode inner_decode; do
            cargo +nightly-2025-06-01 fuzz run "$t" -- -max_total_time=60 -rss_limit_mb=4096
          done

  compose-smoke:
    name: Compose stack reaches ready
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Bring the stack up and wait for control
        run: bash tests/compose/test_compose_up.sh
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

  all-checks-pass:
    name: All checks pass
    if: always()
    needs: [rust, python, supply-chain, docker, helm, fuzz-smoke, compose-smoke]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if any dependency failed
        run: |
          echo '${{ toJSON(needs) }}' | grep -q '"result": "failure"' && exit 1
          echo '${{ toJSON(needs) }}' | grep -q '"result": "cancelled"' && exit 1
          echo ok
