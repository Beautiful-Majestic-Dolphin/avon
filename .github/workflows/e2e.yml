name: E2E
on:
  push: { branches: [main] }
  pull_request: { types: [labeled, synchronize, opened] }
  schedule: [{ cron: "0 3 * * *" }]
permissions: { contents: read }

# A newer push to the same branch supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compose-e2e:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: astral-sh/setup-uv@v3
      # Layers 0 and 1 run cargo on the runner itself, so it needs the same
      # toolchain and protoc the CI workflow installs.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: e2e
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: cp .env.example .env && ./deploy/compose/gen-infra-certs.sh
      # The runner walks every layer, tears the stack down between the map's
      # first compose layer and the rest, and ratchets MISSING against the
      # baseline. It exits non-zero on a regression, which fails the job.
      - run: cd tests/e2e && uv sync --frozen && uv run python runner.py
      - if: always()
        run: docker compose -f docker-compose.yml -f tests/e2e/docker-compose.e2e.yml --profile '*' logs --no-color > tests/e2e/results/compose.log || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            tests/e2e/results
            tests/e2e/baseline.json
