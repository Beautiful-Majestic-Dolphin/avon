syntax = "proto3";
package avon.v1;

import "avon/v1/common.proto";

// Tunnel establishment handshake (sent over UDP after control plane approval)
message TunnelHandshake {
  bytes session_id = 1;
  oneof message {
    TunnelInit init = 2;
    TunnelResponse response = 3;
    TunnelConfirm confirm = 4;
  }
}

// Initial tunnel handshake from initiator
message TunnelInit {
  HybridPublicKey ephemeral_public = 1;  // Initiator's ephemeral key
  bytes encrypted_cert = 2;  // Certificate encrypted to peer's public key
}

// Response from responder with encapsulation
message TunnelResponse {
  HybridEncapsulation encapsulation = 1;  // Key encapsulation to initiator
  bytes encrypted_cert = 2;  // Certificate encrypted to initiator
}

// Hybrid key encapsulation (X25519 + Kyber768)
message HybridEncapsulation {
  bytes classical_public = 1;  // Ephemeral X25519 public key (32 bytes)
  bytes pqc_ciphertext = 2;    // Kyber768 ciphertext (1088 bytes)
}

// Final confirmation from initiator
message TunnelConfirm {
  bytes encrypted_verify = 1;  // Encrypted verification data proving key possession
}
