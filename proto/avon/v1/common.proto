syntax = "proto3";
package avon.v1;

// Unique device identifier (16-byte UUID)
message DeviceId {
  bytes uuid = 1;  // 16 bytes
}

// Timestamp with nanosecond precision
message Timestamp {
  int64 seconds = 1;
  int32 nanos = 2;
}

// Hybrid public key combining classical and post-quantum algorithms
message HybridPublicKey {
  bytes classical = 1;  // X25519 public key (32 bytes)
  bytes pqc = 2;        // Kyber768 public key (1184 bytes)
}

// Hybrid signature combining classical and post-quantum algorithms
message HybridSignature {
  bytes classical = 1;  // Ed25519 signature (64 bytes)
  bytes pqc = 2;        // Dilithium3 signature (3309 bytes)
}

// X.509-style certificate with hybrid signature
message Certificate {
  bytes der = 1;                    // DER-encoded certificate data
  HybridSignature signature = 2;   // Hybrid signature over der
  bytes ocsp_staple = 3;           // Optional OCSP staple for revocation checking
}
