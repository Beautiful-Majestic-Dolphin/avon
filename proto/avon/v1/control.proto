syntax = "proto3";
package avon.v1;

import "avon/v1/common.proto";

// Top-level control plane message
message ControlMessage {
  uint32 version = 1;
  uint64 sequence = 2;
  DeviceId device_id = 3;
  bytes auth_tag = 4;  // HMAC-SHA256 over serialized payload (32 bytes)
  
  oneof payload {
    PulseRequest pulse_request = 10;
    PulseResponse pulse_response = 11;
    AuthRequest auth_request = 12;
    AuthResponse auth_response = 13;
    ConnectRequest connect_request = 14;
    ConnectResponse connect_response = 15;
    IceCandidates ice_candidates = 16;
    CertRequest cert_request = 17;
    CertResponse cert_response = 18;
    TunnelEstablished tunnel_established = 19;
    TunnelClosed tunnel_closed = 20;
    KeyRotation key_rotation = 21;
  }
}

// Periodic heartbeat request from server to device
message PulseRequest {
  bytes server_nonce = 1;  // 32 bytes for token rotation
  Timestamp timestamp = 2;
  bool request_rotation = 3;  // Server requests token rotation
}

// Heartbeat response from device to server
message PulseResponse {
  bytes client_nonce = 1;  // 32 bytes for token rotation
  Timestamp timestamp = 2;
  bool rotation_ack = 3;  // Device acknowledges rotation
  DevicePosture posture = 4;  // Current device security posture
}

// Device security posture information
message DevicePosture {
  string os_version = 1;
  string agent_version = 2;
  bool firewall_enabled = 3;
  bool disk_encrypted = 4;
  Timestamp last_update = 5;
}

// Initial authentication request from device
message AuthRequest {
  HybridPublicKey ephemeral_public = 1;  // For key exchange
  bytes hardware_fingerprint = 2;  // 32-byte hash of hardware identifiers
  Certificate device_cert = 3;     // If re-authenticating with existing cert
}

// Authentication response from server
message AuthResponse {
  bool success = 1;
  string error_message = 2;
  bytes new_token = 3;  // Encrypted new rotating token
  Certificate issued_cert = 4;  // Newly issued device certificate
}

// Request to connect to another device
message ConnectRequest {
  DeviceId target_device = 1;
  string service_name = 2;  // Optional service identifier
}

// Response with connection approval and peer information
message ConnectResponse {
  bool allowed = 1;
  string deny_reason = 2;
  bytes session_id = 3;    // 16 bytes
  DeviceId target_device = 4;
  repeated IceCandidate target_candidates = 5;
  Certificate target_cert = 6;
}

// ICE candidate exchange for NAT traversal
message IceCandidates {
  bytes session_id = 1;
  repeated IceCandidate candidates = 2;
}

// Individual ICE candidate
message IceCandidate {
  CandidateType type = 1;
  string ip = 2;
  uint32 port = 3;
  uint32 priority = 4;
  string foundation = 5;
}

// ICE candidate types
enum CandidateType {
  CANDIDATE_TYPE_UNSPECIFIED = 0;
  CANDIDATE_TYPE_HOST = 1;
  CANDIDATE_TYPE_SERVER_REFLEXIVE = 2;
  CANDIDATE_TYPE_RELAY = 3;
}

// Certificate signing request
message CertRequest {
  HybridPublicKey public_key = 1;
}

// Certificate signing response
message CertResponse {
  Certificate certificate = 1;
  Timestamp expires_at = 2;
}

// Notification that tunnel is established
message TunnelEstablished {
  bytes session_id = 1;
  DeviceId peer_device = 2;
  Timestamp established_at = 3;
}

// Notification that tunnel is closed
message TunnelClosed {
  bytes session_id = 1;
  CloseReason reason = 2;
  uint64 bytes_sent = 3;
  uint64 bytes_received = 4;
}

// Tunnel close reasons
enum CloseReason {
  CLOSE_REASON_UNSPECIFIED = 0;
  CLOSE_REASON_NORMAL = 1;
  CLOSE_REASON_TIMEOUT = 2;
  CLOSE_REASON_ERROR = 3;
  CLOSE_REASON_POLICY_REVOKED = 4;
}

// Key rotation message
message KeyRotation {
  bytes client_nonce = 1;
  Timestamp timestamp = 2;
}
