[workspace]
resolver = "2"
exclude = ["crates/avon-crypto/fuzz", "crates/avon-tunnel/fuzz"]
# NOTE (phase 3): avon-agent still imports the deleted `avon.v1` protobuf
# package and is out of the workspace until task 3.8 rewrites it.
members = [
    "crates/avon-crypto",
    "crates/avon-protocol",
    "crates/avon-tls",
    "crates/avon-tunnel",
    "crates/avon-control",
    "crates/avon-gateway",
    "crates/avon-ca",
    "crates/avon-bootstrap",
    "crates/avon-common",
    "crates/avon-config",
    "crates/avon-db",
    "crates/avon-observability",
    "crates/avon-testkit",
    "crates/avon-agent-core",
    "crates/avon-tun",
    "crates/avon-agent",
    "crates/avon-policy",
]

[workspace.package]
edition = "2021"
version = "0.2.0"
authors = ["AVON Team"]
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util", "fs", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2.0"
anyhow = "1.0"
base64ct = "1.6"
prost = "0.13"
prost-types = "0.13"
clap = { version = "4.5", features = ["derive", "env"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
zeroize = { version = "1.8", features = ["derive"] }
subtle = "2.6"
bytes = "1.7"
dashmap = "6.1"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false, features = ["http-listener"] }
axum = "0.7"
tonic = "0.13"
tonic-health = "0.13"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "migrate", "uuid", "chrono", "json", "ipnetwork"] }
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "tokio-rustls-comp", "connection-manager"] }
proptest = "1.5"
tempfile = "3.12"
tokio-stream = { version = "0.1", features = ["net", "sync"] }

# Internal crates
avon-crypto = { path = "crates/avon-crypto" }
avon-protocol = { path = "crates/avon-protocol" }
avon-common = { path = "crates/avon-common" }
avon-config = { path = "crates/avon-config" }
avon-db = { path = "crates/avon-db" }
avon-observability = { path = "crates/avon-observability" }
avon-tls = { path = "crates/avon-tls" }
avon-tunnel = { path = "crates/avon-tunnel" }
avon-control = { path = "crates/avon-control" }
avon-gateway = { path = "crates/avon-gateway" }
avon-ca = { path = "crates/avon-ca" }
avon-testkit = { path = "crates/avon-testkit" }
avon-agent-core = { path = "crates/avon-agent-core" }
avon-tun = { path = "crates/avon-tun" }
avon-agent = { path = "crates/avon-agent" }
avon-policy = { path = "crates/avon-policy" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = 3

[profile.dev.package."*"]
opt-level = 1
