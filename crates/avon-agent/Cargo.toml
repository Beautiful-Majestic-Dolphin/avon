[package]
name = "avon-agent"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
description = "AVON Endpoint Agent"

[[bin]]
name = "avon-agent"
path = "src/main.rs"

[[bin]]
name = "avon-agent-helper"
path = "src/bin/avon-agent-helper.rs"

[dependencies]
tokio.workspace = true
async-trait.workspace = true
nix = { version = "0.29", features = ["socket", "uio", "user", "fs", "process"] }
ipnet = "2.9"
serde.workspace = true
serde_json = "1.0"
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
anyhow.workspace = true
avon-crypto.workspace = true
avon-protocol.workspace = true
avon-common.workspace = true
avon-config.workspace = true
avon-tls.workspace = true
avon-tunnel.workspace = true
avon-agent-core.workspace = true
avon-keystore.workspace = true
avon-tun.workspace = true
prost.workspace = true
clap.workspace = true
toml = "0.8"
url = "2.5"
sha2 = "0.10"
sysinfo = "0.30"
uuid.workspace = true
chrono.workspace = true
rand = "0.8"
zeroize.workspace = true
hex = "0.4"
dashmap.workspace = true
base64ct.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-service = "0.7"

[dependencies.ctap-hid-fido2]
version = "3.5"
optional = true

[features]
default = []
# Hardware key providers are selected in avon-keystore; the agent only forwards
# the feature so its own platform code can be gated on the same name.
tpm2 = ["avon-keystore/tpm2"]
keychain = ["avon-keystore/keychain"]
cng = ["avon-keystore/cng"]
fido2 = ["ctap-hid-fido2"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[package.metadata.deb]
name = "avon-agent"
maintainer = "AVON Team <support@avon.example>"
copyright = "2026, AVON"
license-file = ["../../LICENSE", "0"]
extended-description = "Post-quantum zero-trust network access agent with hardware-backed identity."
depends = "$auto, systemd"
section = "net"
priority = "optional"
assets = [
    ["../../target/release/avon-agent", "usr/bin/", "755"],
    ["../../target/release/avon-agent-helper", "usr/bin/", "755"],
    ["../../deploy/linux/avon-agent.service", "lib/systemd/system/", "644"],
    ["../../deploy/linux/avon-agent-helper.service", "lib/systemd/system/", "644"],
    ["../../deploy/linux/avon-agent.sysusers", "usr/lib/sysusers.d/avon-agent.conf", "644"],
    ["../../deploy/linux/avon-agent.tmpfiles", "usr/lib/tmpfiles.d/avon-agent.conf", "644"],
    ["../../docs/agent-installation.md", "usr/share/doc/avon-agent/", "644"],
]
maintainer-scripts = "../../deploy/linux"

[package.metadata.generate-rpm]
license = "MIT"
summary = "AVON post-quantum zero-trust network access agent"
assets = [
    { source = "../../target/release/avon-agent", dest = "/usr/bin/avon-agent", mode = "755" },
    { source = "../../target/release/avon-agent-helper", dest = "/usr/bin/avon-agent-helper", mode = "755" },
    { source = "../../deploy/linux/avon-agent.service", dest = "/lib/systemd/system/avon-agent.service", mode = "644" },
    { source = "../../deploy/linux/avon-agent-helper.service", dest = "/lib/systemd/system/avon-agent-helper.service", mode = "644" },
    { source = "../../deploy/linux/avon-agent.sysusers", dest = "/usr/lib/sysusers.d/avon-agent.conf", mode = "644" },
    { source = "../../deploy/linux/avon-agent.tmpfiles", dest = "/usr/lib/tmpfiles.d/avon-agent.conf", mode = "644" },
]
post_install_script = "../../deploy/linux/postinst"
post_uninstall_script = "../../deploy/linux/postrm"

[package.metadata.generate-rpm.requires]
systemd = "*"

[lib]
name = "avon_agent"
path = "src/lib.rs"
