[package]
name = "avon-agent"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
description = "AVON Endpoint Agent"

[[bin]]
name = "avon-agent"
path = "src/main.rs"

[[bin]]
name = "avon-agent-helper"
path = "src/bin/avon-agent-helper.rs"

[dependencies]
tokio.workspace = true
async-trait.workspace = true
nix = { version = "0.29", features = ["socket", "uio", "user", "fs", "process"] }
ipnet = "2.9"
serde.workspace = true
serde_json = "1.0"
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
anyhow.workspace = true
avon-crypto.workspace = true
avon-protocol.workspace = true
avon-common.workspace = true
avon-config.workspace = true
avon-tls.workspace = true
avon-tunnel.workspace = true
avon-agent-core.workspace = true
avon-keystore.workspace = true
avon-tun.workspace = true
prost.workspace = true
clap.workspace = true
toml = "0.8"
url = "2.5"
sha2 = "0.10"
sysinfo = "0.30"
uuid.workspace = true
chrono.workspace = true
rand = "0.8"
zeroize.workspace = true
hex = "0.4"
dashmap.workspace = true
base64ct.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
tss-esapi = { version = "7.5", optional = true }

[dependencies.ctap-hid-fido2]
version = "3.5"
optional = true

[features]
default = []
tpm = ["tss-esapi"]
fido2 = ["ctap-hid-fido2"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[package.metadata.deb]
name = "avon-agent"
maintainer = "AVON Team <support@avon.example>"
copyright = "2026, AVON"
license-file = ["LICENSE", "0"]
extended-description = "AVON Endpoint Agent with hardware-backed identity"
depends = "systemd, libssl3"
section = "net"
priority = "optional"
assets = [
    ["target/release/avon-agent", "usr/bin/", "755"],
    ["target/release/avon-agent-helper", "usr/bin/", "755"],
    ["deploy/linux/avon-agent.service", "lib/systemd/system/", "644"],
]

[lib]
name = "avon_agent"
path = "src/lib.rs"
