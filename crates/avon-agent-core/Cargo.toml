[package]
name = "avon-agent-core"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
description = "Platform-independent agent core: identity, control client, session manager and run loop"

[dependencies]
avon-common.workspace = true
avon-crypto.workspace = true
avon-protocol.workspace = true
avon-tls.workspace = true
avon-tunnel.workspace = true
tokio.workspace = true
prost.workspace = true
dashmap.workspace = true
thiserror.workspace = true
tracing.workspace = true
metrics.workspace = true
bytes.workspace = true
parking_lot = "0.12"
async-trait = "0.1"
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
anyhow.workspace = true
rcgen = { version = "0.13", features = ["pem"] }
