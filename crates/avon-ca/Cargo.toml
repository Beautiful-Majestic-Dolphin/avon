[package]
name = "avon-ca"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
description = "AVON certificate authority"

[[bin]]
name = "avon-ca"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
avon-common.workspace = true
avon-config.workspace = true
avon-crypto.workspace = true
avon-db.workspace = true
avon-observability.workspace = true
avon-protocol.workspace = true
avon-tls.workspace = true
tokio.workspace = true
tonic = { workspace = true, features = ["tls-aws-lc"] }
prost.workspace = true
sqlx.workspace = true
clap.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
zeroize.workspace = true
base64ct = { workspace = true, features = ["alloc"] }
async-trait = "0.1"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
x509-parser = "0.16"
sha2 = "0.10"
metrics.workspace = true
rand = "0.8"

[dev-dependencies]
avon-testkit.workspace = true
tempfile.workspace = true

[lints]
workspace = true
