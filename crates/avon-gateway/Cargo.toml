[package]
name = "avon-gateway"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
description = "AVON gateway: ATP/2 data plane, relay and egress to protected networks"

[[bin]]
name = "avon-gateway"
path = "src/main.rs"

[lib]
name = "avon_gateway"
path = "src/lib.rs"

[dependencies]
avon-common.workspace = true
avon-config.workspace = true
avon-crypto.workspace = true
avon-observability.workspace = true
avon-policy.workspace = true
avon-protocol.workspace = true
avon-tls.workspace = true
avon-tun.workspace = true
avon-tunnel.workspace = true
tokio.workspace = true
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tonic.workspace = true
prost.workspace = true
redis.workspace = true
clap.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
metrics.workspace = true
dashmap.workspace = true
async-trait = "0.1"
ipnet = "2.10"
ip_network = "0.4"
ip_network_table = "0.2"
parking_lot = "0.12"

[dev-dependencies]
avon-testkit.workspace = true
avon-control.workspace = true
avon-db.workspace = true
tempfile.workspace = true
tokio-stream = { version = "0.1", features = ["net", "sync"] }
sqlx = { workspace = true }
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true

[lints]
workspace = true
