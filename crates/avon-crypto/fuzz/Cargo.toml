[package]
name = "avon-crypto-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Listed in the root manifest's `workspace.exclude`, but cargo still walks up
# and refuses a manifest that has no `[workspace]` of its own.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
avon-crypto = { path = ".." }

[[bin]]
name = "cert_decode"
path = "fuzz_targets/cert_decode.rs"
test = false
doc = false

[[bin]]
name = "hybrid_pk_decode"
path = "fuzz_targets/hybrid_pk_decode.rs"
test = false
doc = false

[[bin]]
name = "hybrid_sig_decode"
path = "fuzz_targets/hybrid_sig_decode.rs"
test = false
doc = false

[[bin]]
name = "tbs_roundtrip"
path = "fuzz_targets/tbs_roundtrip.rs"
test = false
doc = false
