[package]
name = "avon-crypto"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
description = "Cryptographic primitives for AVON"

[dependencies]
serde.workspace = true
thiserror.workspace = true
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1.7", features = ["derive"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
pqcrypto-mlkem = "0.1"
pqcrypto-mldsa = "0.1"
pqcrypto-traits = "0.3"

[features]
test-vectors = []

[dev-dependencies]
hex = "0.4"
serde_json = "1.0"
criterion = "0.5"
proptest = "1.5"

[[bench]]
name = "crypto_bench"
harness = false

[lints]
workspace = true
