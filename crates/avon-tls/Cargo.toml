[package]
name = "avon-tls"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
description = "TLS configuration helpers (hybrid PQ key exchange, mTLS, SPIFFE identities) for AVON"

[dependencies]
avon-config.workspace = true
avon-common.workspace = true
tonic = { workspace = true, features = ["tls-aws-lc"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "tls12", "prefer-post-quantum", "std"] }
rustls-pemfile = "2.2"
rustls-pki-types = "1.10"
x509-parser = "0.16"
sha2 = "0.10"
thiserror.workspace = true

[dev-dependencies]
avon-testkit.workspace = true
tokio.workspace = true
tokio-rustls = "0.26"
pem = "3.0"

[lints]
workspace = true
