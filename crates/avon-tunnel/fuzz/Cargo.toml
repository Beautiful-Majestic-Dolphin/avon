[package]
name = "avon-tunnel-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Listed in the root manifest's `workspace.exclude`, but cargo still walks up
# and refuses a manifest that has no `[workspace]` of its own.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
avon-tunnel = { path = ".." }

[[bin]]
name = "header_decode"
path = "fuzz_targets/header_decode.rs"
test = false
doc = false

[[bin]]
name = "inner_decode"
path = "fuzz_targets/inner_decode.rs"
test = false
doc = false
