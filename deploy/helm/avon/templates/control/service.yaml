apiVersion: v1
kind: Service
metadata:
  name: {{ include "avon.control.fullname" . }}
  labels:
    {{- include "avon.control.labels" . | nindent 4 }}
spec:
  type: {{ .Values.control.service.type }}
  ports:
    - port: {{ .Values.control.service.port }}
      targetPort: grpc
      protocol: TCP
      name: grpc
    - port: 9090
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "avon.control.selectorLabels" . | nindent 4 }}
