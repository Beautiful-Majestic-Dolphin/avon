{{- if not .Values.control.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "avon.control.fullname" . }}
  labels:
    {{- include "avon.control.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Never randAlphaNum: a regenerated value on every upgrade would silently
  # point control at a different database.
  AVON_DATABASE_URL: {{ required "control.databaseUrl or control.existingSecret is required" .Values.control.databaseUrl | quote }}
  AVON_REDIS_URL: {{ required "control.redisUrl or control.existingSecret is required" .Values.control.redisUrl | quote }}
{{- end }}
