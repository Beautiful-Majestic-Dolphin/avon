apiVersion: v1
kind: Secret
metadata:
  name: {{ include "avon.fullname" . }}-secrets
  labels:
    {{- include "avon.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.jwtSecret }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | b64enc | quote }}
  {{- else }}
  JWT_SECRET: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.databaseUrl }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | b64enc | quote }}
  {{- else }}
  DATABASE_URL: {{ printf "postgres://avon:%s@%s:5432/avon" (default "avon" .Values.postgresql.auth.postgresPassword) (include "avon.postgresql.host" .) | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.redisUrl }}
  REDIS_URL: {{ .Values.secrets.redisUrl | b64enc | quote }}
  {{- else }}
  REDIS_URL: {{ printf "redis://:%s@%s:6379" (default "" .Values.redis.auth.password) (include "avon.redis.host" .) | b64enc | quote }}
  {{- end }}
