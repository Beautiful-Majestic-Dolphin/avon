{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "avon.fullname" . }}-network-policy
  labels:
    {{- include "avon.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "avon.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from within the namespace
    - from:
        - podSelector:
            matchLabels:
              {{- include "avon.selectorLabels" . | nindent 14 }}
    # Allow traffic from ingress controller for admin-api
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: {{ .Values.adminApi.service.port }}
    # Allow external UDP traffic to gateway
    - ports:
        - protocol: UDP
          port: {{ .Values.gateway.service.port }}
  egress:
    # Allow traffic to within the namespace
    - to:
        - podSelector:
            matchLabels:
              {{- include "avon.selectorLabels" . | nindent 14 }}
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # Allow traffic to PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432
    # Allow traffic to Redis
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
{{- end }}
