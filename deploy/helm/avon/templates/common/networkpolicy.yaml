{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "avon.fullname" . }}-network-policy
  labels:
    {{- include "avon.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "avon.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from within the namespace
    - from:
        - podSelector:
            matchLabels:
              {{- include "avon.selectorLabels" . | nindent 14 }}
    # Allow traffic from ingress controller for admin-api
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: {{ .Values.adminApi.service.port }}
    # Allow external UDP traffic to gateway
    - ports:
        - protocol: UDP
          port: {{ .Values.gateway.service.port }}
    {{- if and .Values.serviceMesh.enabled (eq .Values.serviceMesh.provider "istio") }}
    # Allow Istio sidecar and control plane traffic
    - from:
        - podSelector:
            matchLabels:
              {{- include "avon.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 15006
        - protocol: TCP
          port: 15001
        - protocol: TCP
          port: 15021
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 15017
    # Allow Istio ingress gateway to reach admin-api
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
          podSelector:
            matchLabels:
              istio: ingressgateway
      ports:
        - protocol: TCP
          port: {{ .Values.adminApi.service.port }}
    {{- end }}
    {{- if and .Values.serviceMesh.enabled (eq .Values.serviceMesh.provider "linkerd") }}
    # Allow Linkerd proxy and control plane traffic
    - from:
        - podSelector:
            matchLabels:
              {{- include "avon.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 4143
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: linkerd
      ports:
        - protocol: TCP
          port: 4191
    {{- end }}
    {{- if .Values.serviceMesh.enabled }}
    # Allow Prometheus to scrape metrics
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
    {{- end }}
  egress:
    # Allow traffic to within the namespace
    - to:
        - podSelector:
            matchLabels:
              {{- include "avon.selectorLabels" . | nindent 14 }}
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # Allow traffic to PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432
    # Allow traffic to Redis
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
    {{- if and .Values.serviceMesh.enabled (eq .Values.serviceMesh.provider "istio") }}
    # Allow egress to istiod for xDS and certificate signing
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 15012
        - protocol: TCP
          port: 15014
    {{- end }}
    {{- if and .Values.serviceMesh.enabled (eq .Values.serviceMesh.provider "linkerd") }}
    # Allow egress to Linkerd control plane
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: linkerd
      ports:
        - protocol: TCP
          port: 8086
        - protocol: TCP
          port: 8090
    {{- end }}
    {{- if not .Values.postgresql.enabled }}
    # Allow traffic to external PostgreSQL
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: {{ .Values.externalDatabase.port | default 5432 }}
    {{- end }}
    {{- if not .Values.redis.enabled }}
    # Allow traffic to external Redis
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: {{ .Values.externalRedis.port | default 6379 }}
    {{- end }}
{{- end }}
