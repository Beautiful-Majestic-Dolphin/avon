apiVersion: v1
kind: Service
metadata:
  name: {{ include "avon.pulse.fullname" . }}
  labels:
    {{- include "avon.pulse.labels" . | nindent 4 }}
spec:
  type: {{ .Values.pulse.service.type }}
  ports:
    - port: {{ .Values.pulse.service.port }}
      targetPort: grpc
      protocol: TCP
      name: grpc
  selector:
    {{- include "avon.pulse.selectorLabels" . | nindent 4 }}
