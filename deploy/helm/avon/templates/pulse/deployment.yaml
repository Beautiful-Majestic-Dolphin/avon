apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "avon.pulse.fullname" . }}
  labels:
    {{- include "avon.pulse.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.pulse.replicaCount }}
  selector:
    matchLabels:
      {{- include "avon.pulse.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
        checksum/config: {{ include (print $.Template.BasePath "/pulse/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/common/secrets.yaml") . | sha256sum }}
        {{- include "avon.meshAnnotations" . | nindent 8 }}
        {{- with .Values.pulse.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "avon.pulse.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "avon.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.pulse.podSecurityContext | nindent 8 }}
      containers:
        - name: pulse
          securityContext:
            {{- toYaml .Values.pulse.securityContext | nindent 12 }}
          image: {{ include "avon.image" (dict "global" .Values.global "image" .Values.pulse.image) }}
          imagePullPolicy: {{ .Values.pulse.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: {{ .Values.pulse.service.port }}
              protocol: TCP
            - name: health
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: AVON_LOG_LEVEL
              value: {{ .Values.pulse.logLevel | default "info" | quote }}
            - name: AVON_GRPC_PORT
              value: {{ .Values.pulse.service.port | quote }}
            - name: AVON_HEALTH_PORT
              value: "8080"
            - name: AVON_METRICS_PORT
              value: "9090"
            - name: AVON_PULSE_INTERVAL
              value: {{ .Values.pulse.pulseInterval | default "10s" | quote }}
            - name: AVON_TOKEN_ROTATION_INTERVAL
              value: {{ .Values.pulse.tokenRotationInterval | default "30s" | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "avon.pulse.fullname" . }}-config
            - secretRef:
                name: {{ include "avon.fullname" . }}-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.pulse.resources | nindent 12 }}
      {{- with .Values.pulse.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pulse.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if not .Values.pulse.affinity }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "avon.pulse.selectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- with .Values.pulse.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
