apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "avon.pulse.fullname" . }}-config
  labels:
    {{- include "avon.pulse.labels" . | nindent 4 }}
data:
  RUST_LOG: "info"
  PULSE_PORT: "{{ .Values.pulse.service.port }}"
  AUTH_SERVICE_URL: "{{ include "avon.auth.fullname" . }}:{{ .Values.auth.service.port }}"
  POSTGRESQL_HOST: {{ include "avon.postgresql.host" . | quote }}
  REDIS_HOST: {{ include "avon.redis.host" . | quote }}
