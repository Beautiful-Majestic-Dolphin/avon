{{- if and .Values.serviceMesh.enabled (eq .Values.serviceMesh.provider "istio") .Values.serviceMesh.istio.gateway.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: {{ include "avon.adminApi.fullname" . }}-gateway
  labels:
    {{- include "avon.adminApi.labels" . | nindent 4 }}
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: {{ .Values.serviceMesh.istio.gateway.tls.mode | default "SIMPLE" }}
        credentialName: {{ .Values.serviceMesh.istio.gateway.tls.credentialName | default "admin-tls" }}
      hosts:
        {{- range .Values.serviceMesh.istio.gateway.hosts }}
        - {{ . | quote }}
        {{- end }}
    - port:
        number: 80
        name: http
        protocol: HTTP
      tls:
        httpsRedirect: true
      hosts:
        {{- range .Values.serviceMesh.istio.gateway.hosts }}
        - {{ . | quote }}
        {{- end }}
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ include "avon.adminApi.fullname" . }}
  labels:
    {{- include "avon.adminApi.labels" . | nindent 4 }}
spec:
  hosts:
    {{- range .Values.serviceMesh.istio.gateway.hosts }}
    - {{ . | quote }}
    {{- end }}
  gateways:
    - {{ include "avon.adminApi.fullname" . }}-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: {{ include "avon.adminApi.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.adminApi.service.port }}
{{- end }}
