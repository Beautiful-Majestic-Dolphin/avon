{{- if and .Values.serviceMesh.enabled (eq .Values.serviceMesh.provider "istio") }}
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: {{ include "avon.auth.fullname" . }}
  labels:
    {{- include "avon.auth.labels" . | nindent 4 }}
spec:
  host: {{ include "avon.auth.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      http:
        h2UpgradePolicy: UPGRADE
