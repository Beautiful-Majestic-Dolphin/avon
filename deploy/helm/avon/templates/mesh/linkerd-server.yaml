  labels:
    {{- include "avon.adminApi.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: admin-api
  port: {{ .Values.adminApi.service.port }}
  proxyProtocol: HTTP/1
{{- end }}
