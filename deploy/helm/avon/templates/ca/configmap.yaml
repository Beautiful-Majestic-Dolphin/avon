apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "avon.ca.fullname" . }}-config
  labels:
    {{- include "avon.ca.labels" . | nindent 4 }}
data:
  RUST_LOG: "info"
  CA_PORT: "{{ .Values.ca.service.port }}"
  CA_DATA_DIR: "/data"
  HSM_ENABLED: "{{ .Values.ca.hsm.enabled }}"
  {{- if .Values.ca.hsm.enabled }}
  HSM_PROVIDER: "{{ .Values.ca.hsm.provider }}"
  {{- end }}
  POSTGRESQL_HOST: {{ include "avon.postgresql.host" . | quote }}
  REDIS_HOST: {{ include "avon.redis.host" . | quote }}
