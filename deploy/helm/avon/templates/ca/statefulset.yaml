apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "avon.ca.fullname" . }}
  labels:
    {{- include "avon.ca.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "avon.ca.fullname" . }}
  replicas: {{ .Values.ca.replicaCount }}
  selector:
    matchLabels:
      {{- include "avon.ca.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
        checksum/config: {{ include (print $.Template.BasePath "/ca/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/common/secrets.yaml") . | sha256sum }}
        {{- with .Values.ca.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "avon.ca.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "avon.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.ca.podSecurityContext | nindent 8 }}
      containers:
        - name: ca
          securityContext:
            {{- toYaml .Values.ca.securityContext | nindent 12 }}
          image: {{ include "avon.image" (dict "global" .Values.global "image" .Values.ca.image) }}
          imagePullPolicy: {{ .Values.ca.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: {{ .Values.ca.service.port }}
              protocol: TCP
            - name: health
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: AVON_LOG_LEVEL
              value: {{ .Values.ca.logLevel | default "info" | quote }}
            - name: AVON_GRPC_PORT
              value: {{ .Values.ca.service.port | quote }}
            - name: AVON_HEALTH_PORT
              value: "8080"
            - name: AVON_METRICS_PORT
              value: "9090"
            - name: AVON_DATA_DIR
              value: "/data"
          envFrom:
            - configMapRef:
                name: {{ include "avon.ca.fullname" . }}-config
            - secretRef:
                name: {{ include "avon.fullname" . }}-secrets
          {{- if .Values.ca.persistence.enabled }}
          volumeMounts:
            - name: ca-data
              mountPath: /data
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.ca.resources | nindent 12 }}
      {{- with .Values.ca.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ca.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if not .Values.ca.affinity }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "avon.ca.selectorLabels" . | nindent 18 }}
              topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- with .Values.ca.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.ca.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: ca-data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if or .Values.ca.persistence.storageClass .Values.global.storageClass }}
        storageClassName: {{ .Values.ca.persistence.storageClass | default .Values.global.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.ca.persistence.size }}
  {{- end }}
