apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "avon.ca.fullname" . }}
  labels:
    {{- include "avon.ca.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "avon.ca.fullname" . }}
  # Single writer: `avon-ca init` and CRL versioning assume one issuer.
  replicas: 1
  selector:
    matchLabels:
      {{- include "avon.ca.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
        checksum/config: {{ include (print $.Template.BasePath "/ca/configmap.yaml") . | sha256sum }}
        {{- include "avon.meshAnnotations" . | nindent 8 }}
        {{- with .Values.ca.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "avon.ca.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "avon.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.ca.podSecurityContext | nindent 8 }}
      initContainers:
        # Idempotent: creates the root/issuing/TLS chain only if `ca_keys` is
        # empty, so a restart or a scaled-down/up cycle changes nothing.
        - name: init
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          image: {{ include "avon.image" (dict "global" .Values.global "image" .Values.ca.image) }}
          imagePullPolicy: {{ .Values.ca.image.pullPolicy }}
          args: ["init"]
          envFrom:
            - configMapRef:
                name: {{ include "avon.ca.fullname" . }}-config
            - secretRef:
                name: {{ .Values.control.existingSecret | default (include "avon.control.fullname" .) }}
          env:
            - { name: AVON_CA_MASTER_KEY_FILE, value: /ca/master.key }
          volumeMounts:
            - { name: master-key, mountPath: /ca, readOnly: true }
          resources:
            {{- toYaml .Values.ca.resources | nindent 12 }}
      containers:
        - name: ca
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          image: {{ include "avon.image" (dict "global" .Values.global "image" .Values.ca.image) }}
          imagePullPolicy: {{ .Values.ca.image.pullPolicy }}
          args: ["serve"]
          ports:
            - { name: grpc, containerPort: {{ .Values.ca.service.port }}, protocol: TCP }
            - { name: health, containerPort: 8080, protocol: TCP }
            - { name: metrics, containerPort: 9090, protocol: TCP }
          env:
            - { name: AVON_CA_MASTER_KEY_FILE, value: /ca/master.key }
            - { name: AVON_CA_LISTEN_ADDR, value: "0.0.0.0:{{ .Values.ca.service.port }}" }
            - { name: AVON_TLS_CERT, value: /tls/tls.crt }
            - { name: AVON_TLS_KEY, value: /tls/tls.key }
            - { name: AVON_TLS_CA, value: /tls/ca.crt }
          envFrom:
            - configMapRef:
                name: {{ include "avon.ca.fullname" . }}-config
            - secretRef:
                name: {{ .Values.control.existingSecret | default (include "avon.control.fullname" .) }}
          volumeMounts:
            - { name: master-key, mountPath: /ca, readOnly: true }
            - { name: tls, mountPath: /tls, readOnly: true }
          # gRPC liveness: the CA serves mTLS only, so an HTTP probe on the gRPC
          # port would report a failure that is not one.
          livenessProbe:
            grpc:
              port: {{ .Values.ca.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.ca.resources | nindent 12 }}
      volumes:
        - name: master-key
          secret:
            secretName: {{ .Values.ca.masterKeySecret }}
            defaultMode: 0400
        - name: tls
          secret:
            secretName: {{ .Values.ca.tlsSecret | default (printf "%s-tls" (include "avon.ca.fullname" .)) }}
      {{- with .Values.ca.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ca.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ca.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
