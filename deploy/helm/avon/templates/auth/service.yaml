apiVersion: v1
kind: Service
metadata:
  name: {{ include "avon.auth.fullname" . }}
  labels:
    {{- include "avon.auth.labels" . | nindent 4 }}
spec:
  type: {{ .Values.auth.service.type }}
  ports:
    - port: {{ .Values.auth.service.port }}
      targetPort: grpc
      protocol: TCP
      name: grpc
  selector:
    {{- include "avon.auth.selectorLabels" . | nindent 4 }}
