global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

gateway:
  replicaCount: 3
  image:
    repository: avon/gateway
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    port: 4600
    protocol: UDP
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true

control:
  replicaCount: 2
  logLevel: info
  image:
    repository: avon/control
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 50051
  serviceAccount:
    create: true
  # Set either these two or existingSecret.
  databaseUrl: ""
  redisUrl: ""
  existingSecret: ""
  # Secret with tls.crt / tls.key / ca.crt, from cert-manager or the bootstrap job.
  tlsSecret: ""
  requireDatabaseTls: true
  requireRedisTls: true
  sessionTtlSecs: 86400
  pulseIntervalSecs: 30
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532

ca:
  replicaCount: 2
  image:
    repository: avon/ca
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 50052
  # Keys live in Postgres, sealed by the master key in this Secret; the CA
  # keeps no state on disk.
  persistence:
    enabled: false
    size: 1Gi
    storageClass: ""
  masterKeySecret: avon-ca-master-key
  tlsSecret: ""
  hsm:
    enabled: false
    provider: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault

migrateJob:
  enabled: true
  backoffLimit: 3
  image:
    repository: avon/migrate
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

policyEngine:
  replicaCount: 3
  image:
    repository: avon/policy-engine
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8081
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true

adminApi:
  replicaCount: 2
  image:
    repository: avon/admin-api
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  ingress:
    enabled: true
    className: nginx
    annotations: {}
    hosts:
      - host: admin.avon.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true

postgresql:
  enabled: true
  auth:
    postgresPassword: ""
    database: avon
  primary:
    persistence:
      size: 10Gi

redis:
  enabled: true
  auth:
    enabled: true
    password: ""
  master:
    persistence:
      size: 1Gi

# External database configuration (used when postgresql.enabled=false)
externalDatabase:
  host: ""
  port: 5432
  database: avon
  existingSecret: ""
  existingSecretPasswordKey: password
  existingSecretUsernameKey: username

# External Redis configuration (used when redis.enabled=false)
externalRedis:
  host: ""
  port: 6379
  existingSecret: ""
  existingSecretPasswordKey: password

serviceAccount:
  create: true
  annotations: {}
  name: ""

networkPolicy:
  enabled: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1

secrets:
  jwtSecret: ""
  databaseUrl: ""
  redisUrl: ""

monitoring:
  serviceMonitor:
    enabled: false
    labels: {}
    interval: 30s
    scrapeTimeout: 10s
  grafana:
    enabled: false
    dashboardLabels: {}

# Analytics configuration
analytics:
  enabled: false
  prometheusUrl: "http://prometheus-server:9090"
  collectionIntervalSeconds: 300
  retentionDays: 7

# Service Mesh configuration
serviceMesh:
  enabled: false
  provider: "none"  # none | istio | linkerd
  mtls:
    mode: "STRICT"  # STRICT | PERMISSIVE
  # Istio-specific settings
  istio:
    revision: ""
    gateway:
      enabled: true
      hosts:
        - admin.avon.local
      tls:
        mode: SIMPLE
        credentialName: admin-tls
    authorization:
      enabled: true
    serviceEntries:
      enabled: true
  # Linkerd-specific settings
  linkerd:
    authorization:
      enabled: true
