global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

gateway:
  replicaCount: 3
  image:
    repository: avon/gateway
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    port: 4600
    protocol: UDP
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true

auth:
  replicaCount: 3
  image:
    repository: avon/auth
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 50051
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true

ca:
  replicaCount: 2
  image:
    repository: avon/ca
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 50052
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
  hsm:
    enabled: false
    provider: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false

pulse:
  replicaCount: 3
  image:
    repository: avon/pulse
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 50053
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true

policyEngine:
  replicaCount: 3
  image:
    repository: avon/policy-engine
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8081
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true

adminApi:
  replicaCount: 2
  image:
    repository: avon/admin-api
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  ingress:
    enabled: true
    className: nginx
    annotations: {}
    hosts:
      - host: admin.avon.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true

postgresql:
  enabled: true
  auth:
    postgresPassword: ""
    database: avon
  primary:
    persistence:
      size: 10Gi

redis:
  enabled: true
  auth:
    enabled: true
    password: ""
  master:
    persistence:
      size: 1Gi

# External database configuration (used when postgresql.enabled=false)
externalDatabase:
  host: ""
  port: 5432
  database: avon
  existingSecret: ""
  existingSecretPasswordKey: password
  existingSecretUsernameKey: username

# External Redis configuration (used when redis.enabled=false)
externalRedis:
  host: ""
  port: 6379
  existingSecret: ""
  existingSecretPasswordKey: password

serviceAccount:
  create: true
  annotations: {}
  name: ""

networkPolicy:
  enabled: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1

secrets:
  jwtSecret: ""
  databaseUrl: ""
  redisUrl: ""

monitoring:
  serviceMonitor:
    enabled: false
    labels: {}
    interval: 30s
    scrapeTimeout: 10s
  grafana:
    enabled: false
    dashboardLabels: {}

# Service Mesh configuration
serviceMesh:
  enabled: false
  provider: "none"  # none | istio | linkerd
  mtls:
    mode: "STRICT"  # STRICT | PERMISSIVE
  # Istio-specific settings
  istio:
    revision: ""
    gateway:
      enabled: true
      hosts:
        - admin.avon.local
      tls:
        mode: SIMPLE
        credentialName: admin-tls
    authorization:
      enabled: true
    serviceEntries:
      enabled: true
  # Linkerd-specific settings
  linkerd:
    authorization:
      enabled: true
