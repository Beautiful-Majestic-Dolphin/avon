# AVON Staging Environment Values
# Use with: helm install avon ./avon -f values-staging.yaml

global:
  imageRegistry: ""
  imagePullSecrets:
    - name: regcred
  storageClass: "gp3"

# Staging: Moderate replicas
gateway:
  replicaCount: 2
  logLevel: info
  image:
    tag: staging
    pullPolicy: Always
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  podAnnotations:
    cluster-autoscaler.kubernetes.io/safe-to-evict: "true"

control:
  replicaCount: 2
  logLevel: info
  image:
    tag: staging
    pullPolicy: Always
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

ca:
  replicaCount: 2
  logLevel: info
  image:
    tag: staging
    pullPolicy: Always
  persistence:
    enabled: true
    size: 5Gi
    storageClass: "gp3"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

adminApi:
  replicaCount: 2
  logLevel: info
  image:
    tag: staging
    pullPolicy: Always
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-staging"
    hosts:
      - host: admin.staging.avon.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: admin-tls
        hosts:
          - admin.staging.avon.example.com
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

postgresql:
  enabled: true
  auth:
    existingSecret: avon-postgresql-secret
    database: avon
  primary:
    persistence:
      size: 10Gi
      storageClass: "gp3"

redis:
  enabled: true
  auth:
    enabled: true
    existingSecret: avon-redis-secret
  master:
    persistence:
      size: 1Gi
      storageClass: "gp3"

networkPolicy:
  enabled: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceMesh:
  enabled: true
  provider: "istio"
  mtls:
    mode: "PERMISSIVE"
  istio:
    gateway:
      enabled: true
      hosts:
        - admin.staging.avon.example.com
      tls:
        mode: SIMPLE
        credentialName: admin-tls
    authorization:
      enabled: true
    serviceEntries:
      enabled: true

monitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: prometheus
    interval: 30s
    scrapeTimeout: 10s
  grafana:
    enabled: true
    dashboardLabels:
      grafana_dashboard: "1"

secrets:
  existingSecret: avon-secrets
