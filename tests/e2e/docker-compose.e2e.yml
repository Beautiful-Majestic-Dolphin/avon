# E2E overlay: extends the dev compose (docker-compose.yml) with a protected
# network, a target, and two agents on the public network. Use:
#   docker compose -f docker-compose.yml -f tests/e2e/docker-compose.e2e.yml up -d --build

services:
  # The agents live on `public`; the base compose leaves control and the CA on
  # `default` alone, so without this every agent fails enrollment with
  # "control: transport error" — it cannot resolve or reach them at all.
  control:
    networks:
      - default
      - public

  ca:
    networks:
      - default
      - public

  # The gateway lives on `public`, and session mirroring wants Redis. Redis is
  # only on `default` in the base compose, so without this the gateway cannot
  # resolve or reach it. The gateway now tolerates that (it connects in the
  # background), but mirroring is part of what these layers exist to exercise,
  # so give it the network rather than leave the feature dark.
  redis:
    networks:
      - default
      - public

  gateway:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.gateway-e2e
    environment:
      AVON_PROTECTED_CIDRS: 172.30.0.0/24
    networks:
      - public
      - protected
    # gateway already has NET_ADMIN and /dev/net/tun from base compose
    # Dockerfile.gateway-e2e installs the binary as /usr/local/bin/avon-gateway
    # (not /usr/local/bin/avon, the base image's convention), so the base
    # compose's healthcheck path does not exist here. Override it rather than
    # renaming the binary, since this Dockerfile's whole point is to add
    # e2e-only tooling (iproute2, nftables) around the same binary.
    healthcheck:
      test: ["CMD", "/usr/local/bin/avon-gateway", "health-check"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Four services because each breaks differently. A single nginx on port 80
  # cannot tell you whether the tunnel carries UDP, survives a rekey mid-session,
  # or corrupts a wire protocol that does not silently retry.
  target-http:
    image: nginx:alpine
    container_name: avon-e2e-target-http
    profiles: ["l3", "l4", "l5", "lnet"]
    command: >
      sh -c "dd if=/dev/urandom of=/usr/share/nginx/html/big.bin bs=1M count=8 2>/dev/null;
             exec nginx -g 'daemon off;'"
    networks:
      protected:
        ipv4_address: 172.30.0.10
    healthcheck:
      # 127.0.0.1, not localhost: this container's /etc/hosts resolves
      # `localhost` to ::1 first, and nginx here only binds the IPv4 wildcard,
      # so wget's default AAAA-first lookup hit "Connection refused" every
      # time even with the server fully up. The `control` service's
      # healthcheck above (line 263 of docker-compose.yml) already avoids
      # this the same way.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 3s
      retries: 20

  target-ssh:
    image: linuxserver/openssh-server:latest
    container_name: avon-e2e-target-ssh
    profiles: ["l3", "l4", "l5", "lnet"]
    environment:
      PASSWORD_ACCESS: "true"
      USER_NAME: avon
      USER_PASSWORD: avon-e2e
      SUDO_ACCESS: "false"
    networks:
      protected:
        ipv4_address: 172.30.0.11
    healthcheck:
      test: ["CMD", "sh", "-c", "netstat -ltn | grep -q ':2222'"]
      interval: 3s
      retries: 20

  target-pg:
    image: postgres:16
    container_name: avon-e2e-target-pg
    profiles: ["l3", "l4", "l5", "lnet"]
    environment:
      POSTGRES_PASSWORD: avon-e2e
      POSTGRES_DB: probe
    networks:
      protected:
        ipv4_address: 172.30.0.12
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 3s
      retries: 20

  # R16: alpine/socat, not `apk add socat` at start on plain alpine. The apk
  # install had no retry and nothing in either compose file restarts a dead
  # container, so a transient mirror hiccup made this container exit outright
  # rather than sit unhealthy-and-retrying -- runner.py folds that into the
  # generic "services never became healthy" bucket, which reads as an AVON
  # data-plane failure and cascades to BLOCKED on l4/l5/lnet. alpine/socat's
  # ENTRYPOINT is ["socat"], so `command` below is just socat's own argv --
  # no shell, nothing to install, nothing to fail at start. Pinned to 1.8.1.3,
  # whose image digests are identical to `latest` as of this change.
  target-udp:
    image: alpine/socat:1.8.1.3
    container_name: avon-e2e-target-udp
    profiles: ["l3", "l4", "l5", "lnet"]
    command: ["-v", "UDP-RECVFROM:9999,fork", "EXEC:/bin/cat"]
    networks:
      protected:
        ipv4_address: 172.30.0.13
    healthcheck:
      # The image is Alpine-based and keeps a real shell plus netstat, so this
      # proves the same thing the other targets' healthchecks prove -- a
      # listener actually bound, not just "container up." Retry budget
      # matches its siblings now that there's no apk install to wait out.
      test: ["CMD", "sh", "-c", "netstat -lun | grep -q ':9999'"]
      interval: 3s
      retries: 20

  agent-a:
    profiles: ["l3", "l4", "l5", "lnet"]
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.agent-e2e
    container_name: avon-e2e-agent-a
    environment:
      AVON_AGENT_PULSE_INTERVAL_SECS: 10
      AVON_AGENT_TUN_NAME: avon0
    volumes:
      - certs:/certs:ro
      - agent-a-data:/var/lib/avon
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      - public
    depends_on:
      control:
        condition: service_started
      gateway:
        condition: service_started
      target-http:
        condition: service_healthy

  agent-b:
    profiles: ["l3", "l4", "l5", "lnet"]
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.agent-e2e
    container_name: avon-e2e-agent-b
    environment:
      AVON_AGENT_PULSE_INTERVAL_SECS: 10
      AVON_AGENT_TUN_NAME: avon0
    volumes:
      - certs:/certs:ro
      - agent-b-data:/var/lib/avon
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      - public
    depends_on:
      control:
        condition: service_started
      gateway:
        condition: service_started

  agent-c:
    profiles: ["l3", "l4", "l5", "lnet"]
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.agent-e2e
    container_name: avon-e2e-agent-c
    environment:
      AVON_AGENT_PULSE_INTERVAL_SECS: 10
      AVON_AGENT_TUN_NAME: avon0
    volumes:
      - certs:/certs:ro
      - agent-c-data:/var/lib/avon
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      - public
    depends_on:
      control:
        condition: service_started
      gateway:
        condition: service_started

  # A software TPM the agent talks to over TCP, so the TPM-backed path can be
  # exercised in CI on machines that have no TPM of their own.
  swtpm:
    image: debian:12-slim
    container_name: avon-e2e-swtpm
    profiles: ["l5"]
    # One command per line, no folding: the previous `>` scalar kept the
    # newlines of its more-indented lines, so swtpm started as
    # `swtpm socket --tpm2 --tpmstate dir=/tmpstate` with nothing listening and
    # the option lines ran as separate commands that failed quietly.
    command:
      - bash
      - -c
      - |
        set -e
        apt-get update -qq
        apt-get install -y -qq swtpm swtpm-tools >/dev/null
        mkdir -p /tmpstate
        exec swtpm socket --tpm2 --tpmstate dir=/tmpstate --ctrl type=tcp,port=2322,bindaddr=0.0.0.0 --server type=tcp,port=2321,bindaddr=0.0.0.0 --flags not-need-init,startup-clear
    networks:
      - public
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/2321"]
      interval: 5s
      retries: 20

  agent-tpm:
    profiles: ["l5"]
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.agent-e2e
    container_name: avon-e2e-agent-tpm
    environment:
      AVON_AGENT_PULSE_INTERVAL_SECS: 10
      AVON_AGENT_TUN_NAME: avon0
      AVON_AGENT_KEY_PROVIDER: tpm2
      AVON_TPM_TCTI: "swtpm:host=swtpm,port=2321"
    volumes:
      - certs:/certs:ro
      - agent-tpm-data:/var/lib/avon
      - shared:/shared
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      - public
    depends_on:
      swtpm:
        condition: service_healthy
      control:
        condition: service_started
      gateway:
        condition: service_started

  # Started empty and left idle: the clone test copies an identity into it and
  # checks that the copy is useless. Deliberately no AVON_TPM_TCTI — this
  # container has no TPM.
  agent-clone:
    profiles: ["l5"]
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.agent-e2e
    container_name: avon-e2e-agent-clone
    entrypoint: ["sleep", "infinity"]
    environment:
      AVON_AGENT_TUN_NAME: avon1
    volumes:
      - certs:/certs:ro
      - shared:/shared
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      - public

volumes:
  agent-a-data: {}
  agent-b-data: {}
  agent-c-data: {}
  agent-tpm-data: {}
  shared: {}
