# Local AVON stack. Everything speaks TLS, including Postgres and Redis.
#
# First run:
#   cp .env.example .env && ./deploy/compose/gen-infra-certs.sh && docker compose up -d
#
# The infra CA under deploy/compose/infra-certs only covers Postgres and Redis:
# they must be up before avon-ca exists, so their certificates cannot be
# AVON-issued. Everything AVON issues lives in the `certs` volume.

x-common-env: &common-env
  AVON_DATABASE_URL: postgres://avon:${POSTGRES_PASSWORD}@postgres:5432/avon
  AVON_DATABASE_TLS_CA: /infra/ca.crt
  AVON_REDIS_URL: rediss://:${REDIS_PASSWORD}@redis:6379/0
  AVON_REDIS_TLS_CA: /infra/ca.crt
  AVON_CA_MASTER_KEY_FILE: /ca/master.key
  AVON_LOG_LEVEL: ${AVON_LOG_LEVEL:-info}
  AVON_LOG_FORMAT: json

services:
  postgres:
    image: postgres:16-bookworm
    profiles: ["l2", "l3", "l4", "l5", "lnet"]
    environment:
      POSTGRES_USER: avon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: avon
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/pgcerts/postgres.crt
      - -c
      - ssl_key_file=/pgcerts/postgres.key
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgcerts:/pgcerts:ro
    depends_on:
      pg-cert-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avon"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Postgres refuses a key that is group- or world-readable and must own it, so
  # the bind-mounted files are copied into a volume with the right ownership.
  pg-cert-init:
    image: alpine:3.20
    profiles: ["l2", "l3", "l4", "l5", "lnet"]
    command:
      - sh
      - -c
      - "cp /in/postgres.crt /in/postgres.key /out/ && chown 999:999 /out/postgres.* && chmod 600 /out/postgres.key && chmod 644 /out/postgres.crt"
    volumes:
      - ./deploy/compose/infra-certs:/in:ro
      - pgcerts:/out

  redis:
    image: redis:7-bookworm
    profiles: ["l2", "l3", "l4", "l5", "lnet"]
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set in .env}
      - --port
      - "0"
      - --tls-port
      - "6379"
      - --tls-cert-file
      - /infra/redis.crt
      - --tls-key-file
      - /infra/redis.key
      - --tls-ca-cert-file
      - /infra/ca.crt
      - --tls-auth-clients
      - "no"
    volumes:
      - ./deploy/compose/infra-certs:/infra:ro
    healthcheck:
      test: ["CMD", "redis-cli", "--tls", "--cacert", "/infra/ca.crt", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Named volumes are created root-owned; every AVON image runs as uid 65532.
  vol-init:
    image: alpine:3.20
    profiles: ["l2", "l3", "l4", "l5", "lnet"]
    command:
      - sh
      - -c
      - "chown 65532:65532 /certs /ca && chmod 755 /certs && chmod 700 /ca"
    volumes:
      - certs:/certs
      - cakey:/ca

  # Migrations, CA master key, CA chain, service credentials, first owner.
  bootstrap:
    profiles: ["l2", "l3", "l4", "l5", "lnet"]
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.rust
      args:
        BIN: avon-bootstrap
    command: ["init", "--out", "/certs", "--dns", "ca=ca,control=control,gateway=gateway,admin=admin"]
    environment:
      <<: *common-env
      AVON_BOOTSTRAP_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-owner@example.com}
    volumes:
      - certs:/certs
      - cakey:/ca
      - ./deploy/compose/infra-certs:/infra:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vol-init:
        condition: service_completed_successfully

  ca:
    profiles: ["l2", "l3", "l4", "l5", "lnet"]
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.rust
      args:
        BIN: avon-ca
    command: ["serve"]
    environment:
      <<: *common-env
      AVON_TLS_CERT: /certs/ca.crt
      AVON_TLS_KEY: /certs/ca.key
      AVON_TLS_CA: /certs/trust-ca.crt
      AVON_CA_LISTEN_ADDR: 0.0.0.0:50052
      AVON_HEALTH_ADDR: 0.0.0.0:8080
      AVON_METRICS_ADDR: 0.0.0.0:9090
    volumes:
      - certs:/certs:ro
      - cakey:/ca:ro
      - ./deploy/compose/infra-certs:/infra:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/avon", "health-check"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  control:
    profiles: ["l2", "l3", "l4", "l5", "lnet"]
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.rust
      args:
        BIN: avon-control
    environment:
      <<: *common-env
      AVON_TLS_CERT: /certs/control.crt
      AVON_TLS_KEY: /certs/control.key
      AVON_TLS_CA: /certs/trust-ca.crt
      AVON_CONTROL_CA_URL: https://ca:50052
      AVON_CONTROL_CA_SERVER_NAME: ca
      AVON_CONTROL_LISTEN_ADDR: 0.0.0.0:50051
      AVON_HEALTH_ADDR: 0.0.0.0:8080
      AVON_METRICS_ADDR: 0.0.0.0:9090
    ports:
      - "50051:50051"
      - "8090:8080"
    volumes:
      - certs:/certs:ro
      - ./deploy/compose/infra-certs:/infra:ro
    depends_on:
      ca:
        condition: service_started
    healthcheck:
      test: ["CMD", "/usr/local/bin/avon", "health-check"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  gateway:
    profiles: ["l3", "l4", "l5", "lnet"]
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.rust
      args:
        BIN: avon-gateway
    environment:
      <<: *common-env
      AVON_TLS_CERT: /certs/gateway.crt
      AVON_TLS_KEY: /certs/gateway.key
      AVON_TLS_CA: /certs/trust-ca.crt
      AVON_IDENTITY_DIR: /certs
      AVON_CONTROL_URL: https://control:50051
      AVON_CONTROL_SERVER_NAME: control
      AVON_LISTEN_UDP: 0.0.0.0:4600
      AVON_PUBLIC_ENDPOINT: gateway:4600
      AVON_PROTECTED_CIDRS: 172.30.0.0/24
      AVON_TUN_NAME: avon0
      AVON_HEALTH_ADDR: 0.0.0.0:8080
      AVON_METRICS_ADDR: 0.0.0.0:9090
    ports:
      - "4600:4600/udp"
      - "8081:8080"
    volumes:
      - certs:/certs:ro
      - ./deploy/compose/infra-certs:/infra:ro
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      control:
        condition: service_started
    sysctls:
      net.ipv4.ip_forward: "1"
    healthcheck:
      test: ["CMD", "/usr/local/bin/avon", "health-check"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - public
      - protected

  admin:
    profiles: ["l4", "l5", "lnet"]
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.admin-api
    environment:
      AVON_DATABASE_URL: postgres://avon_admin:${ADMIN_DB_PASSWORD}@postgres:5432/avon
      AVON_DATABASE_TLS_CA: /certs/ca.crt
      AVON_REDIS_URL: rediss://:${REDIS_PASSWORD}@redis:6379/1
      AVON_REDIS_TLS_CA: /certs/ca.crt
      AVON_TLS_CERT: /certs/admin.crt
      AVON_TLS_KEY: /certs/admin.key
      AVON_TLS_CA: /certs/ca.crt
      AVON_ADMIN_CONTROL_URL: https://control:50051
      AVON_ADMIN_CONTROL_SERVER_NAME: control
      AVON_ADMIN_WEBAUTHN_RP_ID: localhost
      AVON_ADMIN_WEBAUTHN_ORIGIN: http://localhost:8080
      AVON_ADMIN_CORS_ORIGINS: '["http://localhost:5173"]'
      AVON_ADMIN_ENABLE_DOCS: "false"
      AVON_ADMIN_JWT_SECRET_FILE: /certs/admin.jwt
      AVON_LOG_FORMAT: json
    ports:
      - "8080:8080"
    volumes:
      - certs:/certs:ro
    depends_on:
      control:
        condition: service_started
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/ready').status==200 else 1)"]
      interval: 10s
      retries: 12


networks:
  public: {}
  protected:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  pgdata: {}
  pgcerts: {}
  certs: {}
  cakey: {}
